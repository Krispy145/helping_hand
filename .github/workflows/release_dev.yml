name: "Release: Dev"

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  web:
    uses: ./.github/workflows/call_deploy_web.yml
    with:
      environment: 'dev'
    secrets: inherit

  api:
    uses: ./.github/workflows/call_deploy_api.yml
    with:
      environment: 'dev'
    secrets: inherit

  mobile:
    uses: ./.github/workflows/call_deploy_mobile.yml
    with:
      flavor: 'dev'
      track: 'internal'
    secrets: inherit
