name: "Release: Production"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  web:
    uses: ./.github/workflows/call_deploy_web.yml
    with:
      environment: 'prod'
    secrets: inherit

  api:
    uses: ./.github/workflows/call_deploy_api.yml
    with:
      environment: 'prod'
    secrets: inherit

  mobile:
    uses: ./.github/workflows/call_deploy_mobile.yml
    with:
      flavor: 'prod'
      track: 'production'
    secrets: inherit
